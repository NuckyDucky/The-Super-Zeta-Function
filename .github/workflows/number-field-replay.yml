name: Number-field arithmetic and zero transfer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'archive/2026-11-20-hidden-lift-v001/**'
      - 'archive/2026-11-20-cap-derivative-recovery-v001/**'
      - 'archive/2026-11-20-dedekind-phase-v001/**'
      - 'archive/2026-11-20-gaussian-branch-spectrum-v001/**'
      - 'archive/2026-11-20-gaussian-two-root-transition-v001/**'
      - 'archive/2026-11-20-gaussian-endpoint-parity-v001/**'
      - 'archive/2026-11-20-gaussian-reflected-disks-v001/**'
      - '.github/workflows/number-field-replay.yml'
  push:
    branches: [main]
    paths:
      - 'archive/2026-11-20-hidden-lift-v001/**'
      - 'archive/2026-11-20-cap-derivative-recovery-v001/**'
      - 'archive/2026-11-20-dedekind-phase-v001/**'
      - 'archive/2026-11-20-gaussian-branch-spectrum-v001/**'
      - 'archive/2026-11-20-gaussian-two-root-transition-v001/**'
      - 'archive/2026-11-20-gaussian-endpoint-parity-v001/**'
      - 'archive/2026-11-20-gaussian-reflected-disks-v001/**'
      - '.github/workflows/number-field-replay.yml'

permissions:
  contents: read

jobs:
  arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive/2026-11-20-dedekind-phase-v001
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the interval arithmetic library
        run: |
          python -m pip install --only-binary=:all: python-flint==0.9.0
      - name: Compare the exact field and class calculations to the archived results
        run: |
          python -B check_gaussian_branch.py
          python -B check_conductor.py > "$RUNNER_TEMP/conductor.json"
          python -B check_phase_classes.py > "$RUNNER_TEMP/phase_classes.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          for name in ("conductor", "phase_classes"):
              path = Path(name + ".json")
              saved = json.loads(path.read_bytes())
              replay = json.loads((Path(os.environ["RUNNER_TEMP"]) / path).read_bytes())
              if saved != replay:
                  raise SystemExit(f"Archived results differ for {name}")
          PY
      - name: Verify the directed finite bound and the two simple field zeros
        run: |
          python -B check_field_windows.py
          python -B check_first_zero.py
      - name: Recover the hidden quartic branches and verify both signed zero intervals
        working-directory: archive/2026-11-20-gaussian-branch-spectrum-v001
        run: |
          python -B branch_test.py verify
          python -B check_w2.py
      - name: Recover the six hidden stage orders from their cap derivatives
        working-directory: archive/2026-11-20-cap-derivative-recovery-v001
        run: |
          mkdir "$RUNNER_TEMP/cap-replay"
          cp packets.json calls.json reveal.json "$RUNNER_TEMP/cap-replay/"
          python -B test_cap_jets.py verify --folder "$RUNNER_TEMP/cap-replay"
          python -B test_cap_jets.py prepare --folder "$RUNNER_TEMP/cap-fresh"
          python -B test_cap_jets.py decode --folder "$RUNNER_TEMP/cap-fresh"
          python -B test_cap_jets.py verify --folder "$RUNNER_TEMP/cap-fresh"
      - name: Recover hidden integer lifts and chronological words and compare the archived calls
        working-directory: archive/2026-11-20-hidden-lift-v001
        run: python -B blind_trial.py verify
      - name: Recompute the two-root quartic and Gaussian contour certificates
        working-directory: archive/2026-11-20-gaussian-two-root-transition-v001
        run: |
          mkdir "$RUNNER_TEMP/gaussian-contours"
          cp check_*.py gaussian_inputs.py "$RUNNER_TEMP/gaussian-contours/"
          cd "$RUNNER_TEMP/gaussian-contours"
          python -B check_quartic_tube.py
          python -B check_quartic_neck.py
          python -B check_gaussian_loop_arcs.py
          python -B check_gaussian_strip_image.py
          python -B check_gaussian_preimage_counts.py
          python -B check_gaussian_target_corridor.py
          python -B check_branch_positions.py
      - name: Verify the Gaussian Hardy bounds and the ordinary zeta count at both endpoints
        working-directory: archive/2026-11-20-gaussian-endpoint-parity-v001
        run: python -B replay.py

  reflected-disks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the interval arithmetic library
        run: python -m pip install --only-binary=:all: python-flint==0.9.0
      - name: Recompute the five circle records and the three zero-weight counts
        working-directory: archive/2026-11-20-gaussian-reflected-disks-v001
        run: python -B replay.py
