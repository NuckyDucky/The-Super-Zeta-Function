name: Number-field arithmetic and zero transfer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'archive/2026-11-20-dedekind-phase-v001/**'
      - '.github/workflows/number-field-replay.yml'
  push:
    branches: [main]
    paths:
      - 'archive/2026-11-20-dedekind-phase-v001/**'
      - '.github/workflows/number-field-replay.yml'

permissions:
  contents: read

jobs:
  arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive/2026-11-20-dedekind-phase-v001
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the interval arithmetic library
        run: |
          python -m pip install --only-binary=:all: python-flint==0.9.0
      - name: Compare the exact field and class calculations to the archived results
        run: |
          python -B check_gaussian_branch.py
          python -B check_conductor.py > "$RUNNER_TEMP/conductor.json"
          python -B check_phase_classes.py > "$RUNNER_TEMP/phase_classes.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          for name in ("conductor", "phase_classes"):
              path = Path(name + ".json")
              saved = json.loads(path.read_bytes())
              replay = json.loads((Path(os.environ["RUNNER_TEMP"]) / path).read_bytes())
              if saved != replay:
                  raise SystemExit(f"Archived results differ for {name}")
          PY
      - name: Verify the directed finite bound and the two simple field zeros
        run: |
          python -B check_field_windows.py
          python -B check_first_zero.py
