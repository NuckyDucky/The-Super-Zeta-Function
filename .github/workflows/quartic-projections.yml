name: Quartic projections
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'archive/2026-11-21-quartic-projections-v001/**'
      - '.github/workflows/quartic-projections.yml'
  push:
    branches: [main]
    paths:
      - 'archive/2026-11-21-quartic-projections-v001/**'
      - '.github/workflows/quartic-projections.yml'
permissions:
  contents: read
jobs:
  arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive/2026-11-21-quartic-projections-v001
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: python-flint==0.9.0 sympy==1.14.0 numpy==2.5.5
      - name: Recover the Pell exponent and compare the sixteen predicted prime traces
        run: |
          python -B stirling_pell.py
          python -B form_predictions.py
      - name: Enclose the weighted prime windows and check the projected crossovers
        run: |
          python -B check_windows.py
          python -B windows/prime_windows.py
      - name: Check the Fourier coefficients and enclose both angular readings
        run: |
          python -B check_quartic_dual_theta.py
          python -B angular/balanced_angular_theta.py
          python -B angular/angular_eighth_power.py
