name: Super Zeta graphs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'archive/2026-11-19-sixth-passes-v001/**'
      - 'archive/2026-11-19-zero-transport-v001/Dottie-Transport-Reversibility/rho6-replay.json'
      - 'archive/2026-11-19-zero-transport-v001/Dottie-Off-Axis-Return/*.py'
      - 'archive/2026-11-20-two-input-map-v001/**'
      - 'archive/2026-11-20-hurwitz-speed-mean-square-v001/**'
      - 'tools/build_sixth_passes.py'
      - 'tools/package_two_input_map.mjs'
      - '.github/workflows/sixth-pass-graph.yml'
  push:
    branches: [main]
    paths:
      - 'archive/2026-11-19-sixth-passes-v001/**'
      - 'archive/2026-11-19-zero-transport-v001/Dottie-Transport-Reversibility/rho6-replay.json'
      - 'archive/2026-11-19-zero-transport-v001/Dottie-Off-Axis-Return/*.py'
      - 'archive/2026-11-20-two-input-map-v001/**'
      - 'archive/2026-11-20-hurwitz-speed-mean-square-v001/**'
      - 'tools/build_sixth_passes.py'
      - 'tools/package_two_input_map.mjs'
      - '.github/workflows/sixth-pass-graph.yml'

permissions:
  contents: read

concurrency:
  group: sixth-pass-graph-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph:
    name: Reproduce and render
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install the pinned plotting and interval arithmetic libraries
        run: |
          python -m pip install --only-binary=:all: -r archive/2026-11-20-two-input-map-v001/requirements.txt
      - name: Recompute the three passes and render the sixth-zero page
        run: python -B tools/build_sixth_passes.py --output "$RUNNER_TEMP/sixth-site"
      - name: Render the two-input map
        run: |
          python -B archive/2026-11-20-two-input-map-v001/make_map.py --output "$RUNNER_TEMP/two-input-map"
      - name: Verify the signed readings in the generated page and link both graphs
        run: node tools/package_two_input_map.mjs "$RUNNER_TEMP/sixth-site" "$RUNNER_TEMP/two-input-map"
      - name: Package both graphs for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/sixth-site
          retention-days: 1

  publish:
    name: Publish both graphs
    needs: graph
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
