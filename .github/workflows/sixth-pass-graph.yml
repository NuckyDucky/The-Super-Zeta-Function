name: Sixth-zero graph

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'archive/2026-11-19-sixth-passes-v001/**'
      - 'archive/2026-11-19-zero-transport-v001/Dottie-Transport-Reversibility/rho6-replay.json'
      - 'archive/2026-11-19-zero-transport-v001/Dottie-Off-Axis-Return/*.py'
      - 'tools/build_sixth_passes.py'
      - '.github/workflows/sixth-pass-graph.yml'
  push:
    branches: [main]
    paths:
      - 'archive/2026-11-19-sixth-passes-v001/**'
      - 'archive/2026-11-19-zero-transport-v001/Dottie-Transport-Reversibility/rho6-replay.json'
      - 'archive/2026-11-19-zero-transport-v001/Dottie-Off-Axis-Return/*.py'
      - 'tools/build_sixth_passes.py'
      - '.github/workflows/sixth-pass-graph.yml'

permissions:
  contents: read

concurrency:
  group: sixth-pass-graph-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph:
    name: Reproduce and render
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install the pinned interval arithmetic library
        run: |
          python3.12 -m venv "$RUNNER_TEMP/sixth-venv"
          "$RUNNER_TEMP/sixth-venv/bin/python" -m pip install --only-binary=:all: python-flint==0.9.0
      - name: Recompute the three passes and render the page
        run: |
          "$RUNNER_TEMP/sixth-venv/bin/python" -B tools/build_sixth_passes.py --output "$RUNNER_TEMP/sixth-site"
      - name: Package the static graph for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/sixth-site
          retention-days: 1

  publish:
    name: Publish the static graph
    needs: graph
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
