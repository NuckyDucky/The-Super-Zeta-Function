name: Dottie marked height replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/dottie-compute-pilot/replay_dottie_height_band.py'
      - 'archive/2026-11-17-quartet-return-recursion-v001/computations/verify_dottie_horn_slice.py'
      - 'verification/dottie-height/**'
      - '.github/workflows/dottie-height-orbit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/dottie-compute-pilot/replay_dottie_height_band.py'
      - 'archive/2026-11-17-quartet-return-recursion-v001/computations/verify_dottie_horn_slice.py'
      - 'verification/dottie-height/**'
      - '.github/workflows/dottie-height-orbit.yml'

permissions:
  contents: read

jobs:
  interval-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: python-flint==0.9.0
      - run: python -B tools/dottie-compute-pilot/replay_dottie_height_band.py
